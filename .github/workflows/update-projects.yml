name: Update Projects Table

on:
  schedule:
    - cron: '0 0 * * *'   # daily at midnight UTC
  workflow_dispatch:        # lets you trigger it manually from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch public repos and rebuild table
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const { data: repos } = await github.rest.repos.listForUser({
              username: 'khemendra-labs',
              type: 'owner',
              sort: 'updated',
              per_page: 100
            });

            // Drop forks and the profile repo itself, sort by most recently pushed
            const filtered = repos
              .filter(r => !r.fork && r.name.toLowerCase() !== 'khemendra-labs')
              .sort((a, b) => new Date(b.pushed_at) - new Date(a.pushed_at))
              .slice(0, 10);

            let table = '| Project | Description | ⭐ Stars | Language |\n|---|---|---|---|\n';
            for (const r of filtered) {
              const desc = (r.description || '_No description_').replace(/\|/g, '-');
              table += `| [${r.name}](${r.html_url}) | ${desc} | ${r.stargazers_count} | ${r.language || '-'} |\n`;
            }

            let readme = fs.readFileSync('README.md', 'utf8');
            const start = '<!-- PROJECTS:START -->';
            const end = '<!-- PROJECTS:END -->';
            const block = new RegExp(`${start}[\\s\\S]*?${end}`);
            readme = readme.replace(block, `${start}\n${table}${end}`);
            fs.writeFileSync('README.md', readme);

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "docs: auto-update projects table"
          git push
