<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Khemendra Singh Khangarot. Cybersecurity, threat intelligence, backend systems.">
  <defs>
    <linearGradient id="inf" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#01cfd6"/>
      <stop offset="0.5" stop-color="#7ff5f7"/>
      <stop offset="1" stop-color="#2a6bff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#01cfd6" stop-opacity="0.35"/>
      <stop offset="0.55" stop-color="#2a6bff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#02060d" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#0e2036" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.75" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="gridmask"><rect width="1200" height="320" fill="url(#fade)"/></mask>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="9"/></filter>
    <clipPath id="type1"><rect x="64" y="196" width="0" height="30"><animate attributeName="width" values="0;520;520;520" keyTimes="0;0.45;0.9;1" dur="9s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="type2"><rect x="64" y="232" width="0" height="30"><animate attributeName="width" values="0;0;640;640" keyTimes="0;0.35;0.8;1" dur="9s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="card"><rect width="1200" height="320" rx="18"/></clipPath>
  </defs>

  <style>
    .sans { font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .mono { font-family: "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes spinr { to { transform: rotate(-360deg); } }
    @keyframes fly { 0% { transform: translateX(0); opacity: 0; } 12% { opacity: 1; } 78% { opacity: 1; } 100% { transform: translateX(var(--d, 380px)); opacity: 0; } }
    @keyframes stop { 0% { transform: translateX(0) scale(1); opacity: 0; } 12% { opacity: 1; } 70% { transform: translateX(var(--d, 380px)) scale(1); opacity: 1; } 100% { transform: translateX(var(--d, 380px)) scale(4); opacity: 0; } }
    @keyframes dash { to { stroke-dashoffset: -520; } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes breathe { 50% { opacity: 0.55; } }
    .ring1 { transform-box: fill-box; transform-origin: center; animation: spin 38s linear infinite; }
    .ring2 { transform-box: fill-box; transform-origin: center; animation: spinr 56s linear infinite; }
    .pk { animation: fly 4.6s linear infinite; }
    .bad { animation: stop 4.6s linear infinite; }
    .trace { stroke-dasharray: 90 430; animation: dash 5.5s linear infinite; }
    .cursor { animation: blink 1s steps(1) infinite; }
    .halo { animation: breathe 4s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="#02060d"/>
    <rect width="1200" height="320" fill="url(#grid)" mask="url(#gridmask)"/>
    <circle cx="960" cy="160" r="260" fill="url(#glow)" class="halo"/>

    <!-- incoming traffic lines -->
    <g stroke="#12304d" stroke-width="1" fill="none">
      <path d="M470 56 L 800 120"/><path d="M430 110 L 790 140"/><path d="M500 170 L 790 160"/>
      <path d="M440 230 L 800 185"/><path d="M520 282 L 810 205"/>
    </g>
    <g stroke="#01cfd6" stroke-width="1.6" fill="none" opacity="0.8" stroke-linecap="round">
      <path class="trace" d="M470 56 L 800 120"/>
      <path class="trace" style="animation-delay:-1.8s" d="M440 230 L 800 185"/>
      <path class="trace" style="animation-delay:-3.4s" d="M500 170 L 790 160"/>
    </g>

    <!-- packets -->
    <g>
      <circle class="pk" style="--d:330px;animation-delay:0s" cx="470" cy="56" r="3" fill="#7ff5f7"/>
      <circle class="pk" style="--d:350px;animation-delay:-1.1s" cx="430" cy="110" r="3" fill="#01cfd6"/>
      <circle class="pk" style="--d:300px;animation-delay:-2.3s" cx="500" cy="170" r="3" fill="#7ff5f7"/>
      <circle class="pk" style="--d:360px;animation-delay:-0.6s" cx="440" cy="230" r="3" fill="#01cfd6"/>
      <circle class="pk" style="--d:300px;animation-delay:-3.1s" cx="520" cy="282" r="3" fill="#7ff5f7"/>
      <circle class="bad" style="--d:330px;animation-delay:-1.7s" cx="470" cy="56" r="3.2" fill="#ff5d6c"/>
      <circle class="bad" style="--d:300px;animation-delay:-3.9s" cx="500" cy="170" r="3.2" fill="#ff5d6c"/>
    </g>

    <!-- rings -->
    <g fill="none">
      <circle class="ring1" cx="960" cy="160" r="128" stroke="#01cfd6" stroke-opacity="0.35" stroke-width="1.2" stroke-dasharray="3 9"/>
      <circle class="ring2" cx="960" cy="160" r="176" stroke="#2a6bff" stroke-opacity="0.35" stroke-width="1.2" stroke-dasharray="2 12"/>
      <circle cx="960" cy="160" r="92" stroke="#01cfd6" stroke-opacity="0.22" stroke-width="1"/>
    </g>

    <!-- infinity emblem -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M884 160 C884 114 936 114 960 160 C984 206 1036 206 1036 160 C1036 114 984 114 960 160 C936 206 884 206 884 160 Z" stroke="url(#inf)" stroke-width="16" filter="url(#blur)" opacity="0.85"/>
      <path d="M884 160 C884 114 936 114 960 160 C984 206 1036 206 1036 160 C1036 114 984 114 960 160 C936 206 884 206 884 160 Z" stroke="url(#inf)" stroke-width="9"/>
    </g>
    <circle cx="960" cy="160" r="9" fill="#ffffff"/>
    <circle cx="960" cy="160" r="22" fill="#7ff5f7" opacity="0.25" class="halo"/>

    <!-- text -->
    <text x="64" y="76" class="mono" font-size="14" fill="#01cfd6" letter-spacing="3">KD // KHEMENDRA-LABS</text>
    <text x="62" y="140" class="sans" font-size="54" font-weight="800" fill="#e4eef5" letter-spacing="-1.5">Khemendra Singh</text>
    <text x="62" y="186" class="sans" font-size="54" font-weight="800" fill="#01cfd6" letter-spacing="-1.5" opacity="0">Khangarot
      <animate attributeName="opacity" values="1" dur="0.01s" fill="freeze"/>
    </text>

    <g clip-path="url(#type1)">
      <text x="64" y="218" class="mono" font-size="17" fill="#8399ad">$ whoami <tspan fill="#e4eef5">cybersecurity · threat intel · backend</tspan></text>
    </g>
    <g clip-path="url(#type2)">
      <text x="64" y="254" class="mono" font-size="17" fill="#8399ad">$ status <tspan fill="#3ddc97">building Animisha</tspan><tspan fill="#8399ad"> // MCA '27 // Delhi</tspan></text>
    </g>
    <rect class="cursor" x="64" y="270" width="10" height="3" fill="#01cfd6"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="18" fill="none" stroke="#12243a"/>
</svg>
